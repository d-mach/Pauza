# PAUZA: snapshot OSM vzniká při sestavení webu, nikoli na telefonech uživatelů.
[build]
  command = "python3 -m pip install --disable-pip-version-check --quiet osmium && python3 scripts/build_places.py"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Access-Control-Allow-Origin = "*"
